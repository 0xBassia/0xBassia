<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="Mohamed Bassia, Security Researcher. 19 published CVEs, peak CVSS 10.0, 4 GHSA advisory credits.">

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.2" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#58a6ff" fill-opacity="0.07"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="900" height="180" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="180" fill="#0d1117"/>
    <rect width="900" height="180" fill="url(#grid)"/>
    <rect width="900" height="180" fill="url(#glow)"/>
    <rect x="0" y="0" width="4" height="180" fill="#58a6ff" fill-opacity="0.85"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="179" rx="12" fill="none" stroke="#21262d"/>

  <!-- prompt line -->
  <text x="34" y="38" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.6">
    <tspan fill="#8b949e">bassia@research</tspan><tspan fill="#484f58">:</tspan><tspan fill="#8b949e">~</tspan><tspan fill="#58a6ff" font-weight="700"> $ </tspan><tspan fill="#a5d6ff">whoami</tspan>
  </text>

  <line x1="34" y1="54" x2="560" y2="54" stroke="url(#rule)" stroke-width="1"/>

  <!-- name -->
  <text x="34" y="108" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Mohamed Bassia<tspan fill="#58a6ff" font-weight="400"> █<animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite" calcMode="discrete"/></tspan></text>

  <!-- role line -->
  <text x="36" y="143" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="13.5" letter-spacing="0.3" fill="#8b949e">Security Researcher<tspan fill="#30363d"> // </tspan>Source-Code Auditing<tspan fill="#30363d"> // </tspan>Responsible Disclosure</text>

  <!-- stat block -->
  <line x1="596" y1="58" x2="596" y2="122" stroke="#21262d" stroke-width="1"/>

  <text x="660" y="98" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#a5d6ff">19</text>
  <text x="660" y="120" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="1.4" fill="#8b949e">CVES</text>

  <line x1="705" y1="72" x2="705" y2="110" stroke="#21262d" stroke-width="1"/>

  <text x="750" y="98" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#a5d6ff">10.0</text>
  <text x="750" y="120" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="1.4" fill="#8b949e">PEAK CVSS</text>

  <line x1="795" y1="72" x2="795" y2="110" stroke="#21262d" stroke-width="1"/>

  <text x="840" y="98" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="28" font-weight="700" fill="#a5d6ff">4</text>
  <text x="840" y="120" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="1.4" fill="#8b949e">GHSA</text>

</svg>
